name: Lint Commit Messages

on:
  push:
    branches: 
      - master
      - develop

  pull_request:
    branches:
      - master
      - develop
      - 'merge-v1.17.3*'

jobs:
  commitlint:
    strategy:
      matrix:
        node-version: [14.x]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            **/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install Deps
        # Pin the commitlint packages to the CommonJS v18 line that matches the
        # commitlint core bundled in wagoid/commitlint-github-action@v5.5.1
        # (@commitlint/load ^18.6.1). Without a pin, npm pulls the latest
        # @commitlint/config-conventional (v19+, ESM-only) into the workspace,
        # which the action resolves via NODE_PATH and require()s, crashing with
        # ERR_REQUIRE_ESM before any commit message is linted.
        run: |
          npm install -g commitlint-plugin-function-rules@2 @commitlint/cli@18 @commitlint/config-conventional@18
          npm install --save-dev commitlint-plugin-function-rules@2 @commitlint/cli@18 @commitlint/config-conventional@18
      - uses: wagoid/commitlint-github-action@v5
        id: commitlint
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        with:
          configFile: /github/workspace/.github/commitlint.config.js
